services:

  db:
    image: postgres:16
    container_name: storybard_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: storybard
    ports:
      - "5432:5432"
    volumes:
      - storybard_pg:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: storybard_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db

  ollama:
    image: ollama/ollama:latest
    container_name: storybard_ollama
    restart: unless-stopped
    command: serve
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

  # 🔥 ONE CONTAINER OTEL STACK
  otel:
    image: grafana/otel-lgtm
    container_name: storybard_otel
    restart: unless-stopped
    ports:
      - "3000:3000"    # Grafana UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP

volumes:
  storybard_pg:
  ollama_models:
  pgadmin_data:
